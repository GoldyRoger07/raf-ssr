<div class="border  border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm transition-all duration-300">
      <!-- En-tête (Question) -->
      <button 
        (click)="toggle.emit()"
        type="button"
        class="w-full flex justify-between items-center p-5 text-left font-medium text-gray-700 hover:bg-slate-50 transition-colors duration-200"
      >
        <span>{{ question }}</span>
        <!-- Icône Flèche qui tourne -->
        <svg 
          [class.rotate-180]="isOpen"
          class="w-5 h-5 text-slate-500 transition-transform duration-300" 
          fill="none" viewBox="0 0 24 24" stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Contenu (Réponse) avec animation de glissement -->
      <div 
        [class.grid-rows-[1fr]]="isOpen"
        [class.grid-rows-[0fr]]="!isOpen"
        class="grid transition-[grid-template-rows] duration-300 ease-in-out"
      >
        <div class="overflow-hidden">
          <div class="p-5 pt-0 text-gray-600 border-t border-slate-100 bg-slate-50/50 leading-relaxed">
            {{ answer }}
          </div>
        </div>
      </div>
    </div>
