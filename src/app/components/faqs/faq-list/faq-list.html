<div class=" flex flex-col items-center gap-2">
            
      @for (faq of faqs; track faq.question; let i = $index) {
        <app-faq-item
          animateOnScroll
          class="fade-up md:w-[75%]"
          [question]="faq.question"
          [answer]="faq.answer"
          [isOpen]="openIndex() === i"
          (toggle)="handleToggle(i)"
        />
      }
    </div>
