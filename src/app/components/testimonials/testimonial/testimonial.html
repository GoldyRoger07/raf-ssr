


<article
                class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm transition hover:-translate-y-1 hover:shadow-xl h-full">

                <div class="flex items-center gap-4">

                    <div
                        class="flex h-14 w-14 items-center justify-center rounded-full bg-(--p-primary-color) text-lg font-bold text-white">

                        {{testimonial.avatar}}

                    </div>

                    <div>

                        <h3 class="font-bold text-slate-900">

                            {{testimonial.name}}

                        </h3>

                        <p class="text-sm text-slate-500">

                            {{testimonial.quizzes}} quiz joués

                        </p>

                    </div>

                </div>

                <div class="mt-5 flex">

                    @for(star of [1,2,3,4,5]; track star){

                    <svg
                        class="h-5 w-5 fill-yellow-400"
                        viewBox="0 0 20 20">

                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.922-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.176 0l-2.8 2.034c-.784.57-1.838-.196-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.719c-.783-.57-.38-1.81.588-1.81H7.03a1 1 0 00.95-.69z">
                        </path>

                    </svg>

                    }

                </div>

                <blockquote class="mt-6 text-slate-600 leading-7">

                    "{{testimonial.message}}"

                </blockquote>

                <div
                    class="mt-8 flex items-center justify-between border-t border-slate-100 pt-5">

                    <span
                        class="rounded-full bg-orange-50 px-3 py-1 text-sm font-medium text-orange-600">

                        💰 Gains : {{testimonial.winnings}}

                    </span>

                    <span class="text-sm font-medium text-green-600">

                        ✓ Vérifié

                    </span>

                </div>

            </article>
