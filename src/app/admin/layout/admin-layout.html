<p-toast position="top-right" />

<div class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <!-- Barre laterale -->
  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-slate-200 bg-white transition-transform
           dark:border-slate-800 dark:bg-slate-900 lg:translate-x-0"
    [class.-translate-x-full]="!menuOpen()"
  >
    <div class="flex h-16 items-center gap-3 border-b border-slate-200 px-5 dark:border-slate-800">
      <img src="img/logo-raf.svg" alt="RAF" class="h-8 w-auto" />
      <span class="text-sm font-semibold uppercase tracking-wide text-slate-500">Back-office</span>
    </div>

    <!-- min-h-0 + overflow : sur un ecran peu haut, la navigation defile au lieu de deborder. -->
    <nav class="min-h-0 flex-1 space-y-1 overflow-y-auto p-3">
      @for (item of nav(); track item.link) {
        @if (item.section) {
          <div class="px-3 pb-1 pt-4 text-xs font-semibold uppercase tracking-wide text-slate-400">{{ item.section }}</div>
        }
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-orange-50 text-orange-700 dark:bg-orange-500/10 dark:text-orange-400"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          (click)="menuOpen.set(false)"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100
                 dark:text-slate-300 dark:hover:bg-slate-800"
        >
          <i [class]="item.icon"></i>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="border-t border-slate-200 p-3 text-xs text-slate-400 dark:border-slate-800">
      Heures affichees : heure d'Haiti
    </div>
  </aside>

  @if (menuOpen()) {
    <div class="fixed inset-0 z-30 bg-black/30 lg:hidden" (click)="menuOpen.set(false)"></div>
  }

  <!-- Contenu -->
  <div class="lg:pl-64">
    <header
      class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur
             dark:border-slate-800 dark:bg-slate-900/90 sm:px-6"
    >
      <p-button
        icon="pi pi-bars"
        [text]="true"
        severity="secondary"
        class="lg:hidden"
        ariaLabel="Ouvrir le menu"
        (onClick)="menuOpen.set(true)"
      />
      <div class="flex-1"></div>
      <p-button
        [icon]="theme() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        ariaLabel="Changer de theme"
        (onClick)="toggleTheme()"
      />
      @if (user(); as u) {
        <div class="flex items-center gap-3">
          <div
            class="flex h-9 w-9 items-center justify-center rounded-full bg-orange-100 text-sm font-semibold text-orange-700
                   dark:bg-orange-500/20 dark:text-orange-300"
          >
            {{ initials() }}
          </div>
          <div class="hidden text-sm leading-tight sm:block">
            <div class="font-medium">{{ u.firstName }} {{ u.lastName }}</div>
            <div class="text-xs text-slate-500">{{ u.roles.join(', ') }}</div>
          </div>
        </div>
      }
      <p-button icon="pi pi-sign-out" [text]="true" severity="secondary" ariaLabel="Se deconnecter" (onClick)="logout()" />
    </header>

    <main class="mx-auto max-w-7xl p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>
