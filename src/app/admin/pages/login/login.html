<div class="flex min-h-screen items-center justify-center bg-slate-50 p-4 dark:bg-slate-950">
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <div class="mb-8 text-center">
      <img src="img/logo-raf.svg" alt="RAF" class="mx-auto mb-4 h-12 w-auto" />
      <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Back-office</h1>
      <p class="mt-1 text-sm text-slate-500">Reserve aux administrateurs et moderateurs</p>
    </div>

    @if (expired) {
      <p-message severity="warn" class="mb-4" text="Votre session a expire, reconnectez-vous." />
    }
    @if (error(); as message) {
      <p-message severity="error" class="mb-4" [text]="message" />
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="username" class="w-full" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="password" class="text-sm font-medium text-slate-700 dark:text-slate-300">Mot de passe</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <p-button type="submit" label="Se connecter" [loading]="loading()" styleClass="w-full" />
    </form>
  </div>
</div>
