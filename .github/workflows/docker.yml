# Construit l'image du site sur GitHub (pas sur le VPS : le build Angular
# demande ~1,5 Go de RAM) et la publie sur GHCR. Coolify ne fait ensuite que
# telecharger l'image et la lancer.
name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige un nom en minuscules.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Redeploiement Coolify. Secrets a creer dans le depot GitHub :
      #   COOLIFY_WEBHOOK : URL "Deploy Webhook" de la ressource (onglet Webhooks)
      #   COOLIFY_TOKEN   : jeton API Coolify (Keys & Tokens, droit "deploy")
      # Sans ces secrets, l'etape est sautee : redeployer a la main dans Coolify.
      - name: Redeployer sur Coolify
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          # Adresse appelee sans la query (uuid), pour le diagnostic : GitHub
          # masque la valeur entiere du secret, pas ce morceau.
          echo "Appel de : ${COOLIFY_WEBHOOK%%\?*}"
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK")
          echo "HTTP $status"
          cat response.txt; echo
          [ "$status" -lt 400 ]
